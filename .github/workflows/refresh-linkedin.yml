name: Refresh LinkedIn dashboard

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linkedin-dashboard-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture LinkedIn activity
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_ORGANIZATION_ID: '104983032'
          LINKEDIN_VERSION: '202608'
        run: node scripts/refresh-linkedin.mjs
      - name: Rebuild dashboard
        run: node scripts/build-dashboard.mjs
      - name: Commit refreshed data
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/linkedin-activity.json index.html
          git commit -m "Refresh LinkedIn dashboard data"
          git push
