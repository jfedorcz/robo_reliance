:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans) !important;
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {

  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {

}

code:not(pre code) {

  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.progress {
  display: flex;
  height: 6px;
  margin-block: calc((var(--line-height-normal, 1.5em) - 6px) / 2);
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

.form-control[type=&quot;file&quot;] {
  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

.form-control[type=&quot;file&quot;]::file-selector-button {
  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

.form-control[type=&quot;file&quot;]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type=&quot;color&quot;] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: superellipse(1.5);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background-color: var(--secondary);

  &lt;header class=&quot;rr-header&quot;&gt;
    &lt;div&gt;
      &lt;p class=&quot;rr-kicker&quot;&gt;Robo Reliance · LinkedIn intelligence&lt;/p&gt;
      &lt;h1&gt;Robotics comment activity&lt;/h1&gt;
      &lt;p class=&quot;rr-subtitle&quot;&gt;Where LinkedIn shows “Robo Reliance commented” on a robotics company’s own post, how many companies are reached, how many are not, and how often direct engagement appears.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;rr-date&quot;&gt;Working dataset&lt;br&gt;August 27, 2026&lt;/div&gt;
  &lt;/header&gt;

  &lt;main class=&quot;rr-main&quot;&gt;
    &lt;details class=&quot;rr-criteria&quot;&gt;
      &lt;summary&gt;
        &lt;span&gt;&lt;span class=&quot;rr-criteria-summary-title&quot;&gt;Criteria and metric definitions&lt;/span&gt;&lt;span class=&quot;rr-criteria-summary-copy&quot;&gt;What is captured, what is excluded, and how the dashboard totals are calculated.&lt;/span&gt;&lt;/span&gt;
        &lt;span class=&quot;rr-criteria-toggle&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;
      &lt;/summary&gt;
      &lt;div class=&quot;rr-criteria-content&quot;&gt;
        &lt;div class=&quot;rr-criteria-grid&quot;&gt;
          &lt;div&gt;
            &lt;h2 class=&quot;rr-section-title&quot;&gt;Evidence criteria&lt;/h2&gt;
            &lt;dl class=&quot;rr-criteria-list&quot;&gt;
              &lt;div&gt;&lt;dt&gt;Actual company post&lt;/dt&gt;&lt;dd&gt;The robotics company published the post, LinkedIn shows “Robo Reliance commented,” and the Robo Reliance comment is visible inside that post’s thread.&lt;/dd&gt;&lt;/div&gt;
              &lt;div&gt;&lt;dt&gt;Third-party post only&lt;/dt&gt;&lt;dd&gt;Robo Reliance commented on another person’s or organization’s post discussing the robotics company, but a comment on the company’s own post is not confirmed.&lt;/dd&gt;&lt;/div&gt;
              &lt;div&gt;&lt;dt&gt;No direct company-post comment confirmed&lt;/dt&gt;&lt;dd&gt;No qualifying comment was found in the posts and threads reviewed. This is an open evidence status—not proof that Robo Reliance never commented.&lt;/dd&gt;&lt;/div&gt;
              &lt;div&gt;&lt;dt&gt;Company inclusion&lt;/dt&gt;&lt;dd&gt;The core watchlist includes companies whose primary business is robotics or robotic systems. Associations and broad technology companies are excluded from the main count.&lt;/dd&gt;&lt;/div&gt;
            &lt;/dl&gt;
          &lt;/div&gt;
          &lt;div&gt;
            &lt;h2 class=&quot;rr-section-title&quot;&gt;Metric calculations&lt;/h2&gt;
            &lt;dl class=&quot;rr-criteria-list&quot;&gt;
              &lt;div&gt;&lt;dt&gt;Confirmed comments · 20&lt;/dt&gt;&lt;dd&gt;Distinct Robo Reliance comments verified on robotics companies’ own LinkedIn posts. Multiple separate company posts count separately.&lt;/dd&gt;&lt;/div&gt;
              &lt;div&gt;&lt;dt&gt;Companies reached · 19 of 71&lt;/dt&gt;&lt;dd&gt;Unique robotics companies with at least one confirmed qualifying comment. A company is counted once regardless of comment frequency.&lt;/dd&gt;&lt;/div&gt;
              &lt;div&gt;&lt;dt&gt;Direct coverage · 26.8%&lt;/dt&gt;&lt;dd&gt;Companies reached divided by all tracked robotics companies: 19 ÷ 71.&lt;/dd&gt;&lt;/div&gt;
              &lt;div&gt;&lt;dt&gt;Without confirmed direct engagement · 52&lt;/dt&gt;&lt;dd&gt;The 12 third-party-only companies plus 40 companies where no direct company-post comment is confirmed.&lt;/dd&gt;&lt;/div&gt;
              &lt;div&gt;&lt;dt&gt;Observed cadence · 2.15 per week&lt;/dt&gt;&lt;dd&gt;Nineteen dated or observation-dated comments across the 62-day evidence window. The undated FANUC confirmation is excluded.&lt;/dd&gt;&lt;/div&gt;
            &lt;/dl&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/details&gt;

    &lt;section class=&quot;rr-scope&quot; aria-labelledby=&quot;rr-scope-heading&quot;&gt;
      &lt;div&gt;
        &lt;h2 id=&quot;rr-scope-heading&quot;&gt;Why these 71 companies?&lt;/h2&gt;
        &lt;p&gt;This is a curated global robotics watchlist built from the companies encountered and reviewed during the Robo Reliance LinkedIn analysis: companies with confirmed comments on their own posts, companies discussed in third-party posts, and relevant robotics companies checked for direct engagement. It is not limited to U.S.-based companies and is not a complete list of every robotics company.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;rr-scope-summary&quot;&gt;Global watchlist · 9 segments&lt;br&gt;North America, Europe and Asia&lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;rr-activity-grid&quot; aria-label=&quot;Company-page comment activity summary&quot;&gt;
      &lt;article class=&quot;rr-activity-stat&quot;&gt;&lt;strong&gt;20&lt;/strong&gt;&lt;span&gt;confirmed comments on robotics-company posts&lt;/span&gt;&lt;/article&gt;
      &lt;button class=&quot;rr-activity-stat&quot; type=&quot;button&quot; data-metric-filter=&quot;direct&quot; aria-label=&quot;Show the 19 of 71 watchlist companies reached&quot;&gt;&lt;strong&gt;19 of 71&lt;/strong&gt;&lt;span&gt;watchlist companies reached · 26.8%&lt;/span&gt;&lt;/button&gt;
      &lt;button class=&quot;rr-activity-stat&quot; type=&quot;button&quot; data-metric-filter=&quot;not-direct&quot; aria-label=&quot;Show the 52 of 71 watchlist companies without a confirmed direct comment&quot;&gt;&lt;strong&gt;52 of 71&lt;/strong&gt;&lt;span&gt;watchlist companies without a confirmed direct comment · 73.2%&lt;/span&gt;&lt;/button&gt;
      &lt;article class=&quot;rr-activity-stat&quot;&gt;&lt;strong&gt;2.15 / week&lt;/strong&gt;&lt;span&gt;observed rate across 19 dated comments&lt;/span&gt;&lt;/article&gt;
    &lt;/section&gt;

    &lt;section class=&quot;rr-review&quot; aria-labelledby=&quot;rr-review-heading&quot;&gt;
      &lt;h2 class=&quot;rr-section-title&quot; id=&quot;rr-review-heading&quot;&gt;How direct comments are verified&lt;/h2&gt;
      &lt;p class=&quot;rr-section-copy&quot;&gt;The Diligent Robotics case shows why company-level search is not enough.&lt;/p&gt;
      &lt;ol class=&quot;rr-review-steps&quot;&gt;
        &lt;li&gt;&lt;strong&gt;1 · Open company posts&lt;/strong&gt;&lt;span&gt;Review the robotics company’s own LinkedIn feed, not only search results.&lt;/span&gt;&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;2 · Open comment threads&lt;/strong&gt;&lt;span&gt;Inspect posts with comments and open the complete discussion.&lt;/span&gt;&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;3 · Expand and scan&lt;/strong&gt;&lt;span&gt;Load visible comments and replies until “Robo Reliance commented” is found or the review is exhausted.&lt;/span&gt;&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;4 · Capture evidence&lt;/strong&gt;&lt;span&gt;Save the exact post or comment URL and comment date before marking the company confirmed.&lt;/span&gt;&lt;/li&gt;
      &lt;/ol&gt;
      &lt;p class=&quot;rr-review-note&quot;&gt;A company without confirmed evidence is an open review item—not proof that Robo Reliance has never commented there.&lt;/p&gt;
    &lt;/section&gt;

      &lt;div&gt;
        &lt;h2 class=&quot;rr-section-title&quot;&gt;Where to improve&lt;/h2&gt;
        &lt;p class=&quot;rr-section-copy&quot;&gt;The largest evidence-backed opportunities in the current watchlist.&lt;/p&gt;
        &lt;div class=&quot;rr-focus-scroll&quot; role=&quot;region&quot; aria-label=&quot;Improvement opportunities; scroll for more&quot;&gt;
          &lt;ol class=&quot;rr-focus-list&quot;&gt;
            &lt;li&gt;&lt;span class=&quot;rr-focus-number&quot;&gt;1&lt;/span&gt;&lt;div&gt;&lt;strong&gt;Move from third-party posts to actual company posts&lt;/strong&gt;&lt;span&gt;Start with the 12 companies discussed through third-party activity but not directly engaged on their own posts; 8 are humanoid or embodied-AI companies.&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
            &lt;li&gt;&lt;span class=&quot;rr-focus-number&quot;&gt;2&lt;/span&gt;&lt;div&gt;&lt;strong&gt;Establish agricultural robotics coverage&lt;/strong&gt;&lt;span&gt;None of the 10 newly reviewed agricultural robotics companies has a confirmed Robo Reliance comment on its own LinkedIn post.&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
            &lt;li&gt;&lt;span class=&quot;rr-focus-number&quot;&gt;3&lt;/span&gt;&lt;div&gt;&lt;strong&gt;Improve consistency&lt;/strong&gt;&lt;span&gt;The dated activity includes a 48-day quiet period followed by seventeen comments within nine days. Target a steadier company-page commenting rhythm.&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
            &lt;li&gt;&lt;span class=&quot;rr-focus-number&quot;&gt;4&lt;/span&gt;&lt;div&gt;&lt;strong&gt;Prioritize the 52 unconfirmed companies&lt;/strong&gt;&lt;span&gt;Rank them by strategic fit and recent posting activity, beginning with the agricultural, humanoid, industrial, and medical robotics opportunities.&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;

        const evidenceQuality = company.status === &#x27;direct&#x27;
          ? (exactEvidence.has(company.name)
              ? &#x27;Exact post/comment link captured&#x27;
              : (feedEvidence.has(company.name) ? &#x27;Visible LinkedIn feed confirmation; exact post link pending&#x27; : &#x27;Company-page evidence captured; exact comment link pending&#x27;))

        detailCopy.textContent = `${statusCopy[company.status]} · ${evidenceQuality} · ${company.segment}`;

      companies

          link.href = linkedinUrl(company);
          link.target = &#x27;_blank&#x27;;
          link.rel = &#x27;noreferrer&#x27;;

      const applyFilters = () =&gt; {
        const query = search.value.trim().toLowerCase();
        const selectedSegment = segment.value;
        let shown = 0;
        [...grid.querySelectorAll(&#x27;.rr-company&#x27;)].forEach(button =&gt; {
          const statusMatches = activeFilter === &#x27;all&#x27;

      const columnFilters = {2:&#x27;direct&#x27;, 3:&#x27;indirect&#x27;, 4:&#x27;none&#x27;, 5:&#x27;direct&#x27;};
      industryRows.forEach(row =&gt; {
        const industry = row.classList.contains(&#x27;rr-industry-total&#x27;) ? &#x27;all industries&#x27; : row.cells[0].textContent.trim();

        row.addEventListener(&#x27;keydown&#x27;, event =&gt; {
          if (event.key === &#x27;Enter&#x27; || event.key === &#x27; &#x27;) {

      });
      search.addEventListener(&#x27;input&#x27;, applyFilters);
      segment.addEventListener(&#x27;change&#x27;, applyFilters);
      recheck.addEventListener(&#x27;click&#x27;, async () =&gt; {
        if (window.openai?.sendFollowUpMessage) {

            title: `Re-check ${selected.name}`,

        window.open(`https://www.linkedin.com/search/results/content/?keywords=${query}`, &#x27;_blank&#x27;, &#x27;noopener,noreferrer&#x27;);
      });
      const xmlEscape = value =&gt; String(value ?? &#x27;&#x27;)
        .replace(/&amp;/g, &#x27;\u0026amp;&#x27;)
        .replace(/&lt;/g, &#x27;\u0026lt;&#x27;)
        .replace(/&gt;/g, &#x27;\u0026gt;&#x27;)
        .replace(/&quot;/g, &#x27;\u0026quot;&#x27;)
        .replace(/&#x27;/g, &#x27;\u0026apos;&#x27;);
      exportExcel.addEventListener(&#x27;click&#x27;, () =&gt; {
        const headers = [&#x27;Company Name&#x27;, &#x27;LinkedIn Link&#x27;, &#x27;City&#x27;, &#x27;State / Region&#x27;, &#x27;Country&#x27;, &#x27;ZIP / Postal Code&#x27;, &#x27;Commented On&#x27;, &#x27;Last Comment&#x27;];
        const headerCells = headers.map(value =&gt; `&lt;Cell ss:StyleID=&quot;Header&quot;&gt;&lt;Data ss:Type=&quot;String&quot;&gt;${xmlEscape(value)}&lt;/Data&gt;&lt;/Cell&gt;`).join(&#x27;&#x27;);
        const rows = companies.slice().sort((a, b) =&gt; a.name.localeCompare(b.name)).map(company =&gt; {
          const location = companyLocations[company.name] || {};
          const link = linkedinUrl(company);
          const values = [company.name, link, location.city || &#x27;&#x27;, location.state || &#x27;&#x27;, countryByRegion[location.state] || &#x27;&#x27;, location.zip || &#x27;&#x27;, company.status === &#x27;direct&#x27; ? &#x27;X&#x27; : &#x27;&#x27;, lastComments[company.name] || &#x27;&#x27;];
          return `&lt;Row&gt;${values.map((value, index) =&gt; index === 1
            ? `&lt;Cell ss:HRef=&quot;${xmlEscape(link)}&quot;&gt;&lt;Data ss:Type=&quot;String&quot;&gt;${xmlEscape(value)}&lt;/Data&gt;&lt;/Cell&gt;`

        }).join(&#x27;&#x27;);
        const workbook = `&lt;?xml version=&quot;1.0&quot;?&gt;&lt;?mso-application progid=&quot;Excel.Sheet&quot;?&gt;&lt;Workbook xmlns=&quot;urn:schemas-microsoft-com:office:spreadsheet&quot; xmlns:ss=&quot;urn:schemas-microsoft-com:office:spreadsheet&quot; xmlns:x=&quot;urn:schemas-microsoft-com:office:excel&quot;&gt;&lt;Styles&gt;&lt;Style ss:ID=&quot;Default&quot; ss:Name=&quot;Normal&quot;&gt;&lt;Alignment ss:Vertical=&quot;Bottom&quot;/&gt;&lt;Font ss:FontName=&quot;Aptos&quot; ss:Size=&quot;11&quot;/&gt;&lt;/Style&gt;&lt;Style ss:ID=&quot;Header&quot;&gt;&lt;Font ss:FontName=&quot;Aptos&quot; ss:Size=&quot;11&quot; ss:Bold=&quot;1&quot; ss:Color=&quot;#FFFFFF&quot;/&gt;&lt;Interior ss:Color=&quot;#0B5CAD&quot; ss:Pattern=&quot;Solid&quot;/&gt;&lt;/Style&gt;&lt;/Styles&gt;&lt;Worksheet ss:Name=&quot;Robotics Companies&quot;&gt;&lt;Table&gt;&lt;Column ss:Width=&quot;185&quot;/&gt;&lt;Column ss:Width=&quot;310&quot;/&gt;&lt;Column ss:Width=&quot;120&quot;/&gt;&lt;Column ss:Width=&quot;120&quot;/&gt;&lt;Column ss:Width=&quot;105&quot;/&gt;&lt;Column ss:Width=&quot;105&quot;/&gt;&lt;Column ss:Width=&quot;90&quot;/&gt;&lt;Column ss:Width=&quot;125&quot;/&gt;&lt;Row&gt;${headerCells}&lt;/Row&gt;${rows}&lt;/Table&gt;&lt;AutoFilter x:Range=&quot;R1C1:R${companies.length + 1}C8&quot;/&gt;&lt;WorksheetOptions xmlns=&quot;urn:schemas-microsoft-com:office:excel&quot;&gt;&lt;FreezePanes/&gt;&lt;FrozenNoSplit/&gt;&lt;SplitHorizontal&gt;1&lt;/SplitHorizontal&gt;&lt;TopRowBottomPane&gt;1&lt;/TopRowBottomPane&gt;&lt;ActivePane&gt;2&lt;/ActivePane&gt;&lt;/WorksheetOptions&gt;&lt;/Worksheet&gt;&lt;/Workbook&gt;`;
        if (window.parent !== window) {

        const blob = new Blob([workbook], {type:&#x27;application/vnd.ms-excel;charset=utf-8&#x27;});
        const url = URL.createObjectURL(blob);
        const download = document.createElement(&#x27;a&#x27;);
        download.href = url;
        download.download = &#x27;robo-reliance-robotics-company-watchlist.xls&#x27;;
        document.body.appendChild(download);

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );

      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {

    }

    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {

    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {

              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );

      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);

  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }

    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {

    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
