    light-dark(rgb(255 255 255), rgb(24 24 24))

}

}

  border: 0 !important;

  &lt;header class=&quot;rr-header&quot;&gt;
    &lt;div&gt;
      &lt;p class=&quot;rr-kicker&quot;&gt;Robo Reliance &#183; LinkedIn intelligence&lt;/p&gt;
      &lt;h1&gt;Robotics comment activity&lt;/h1&gt;
      &lt;p class=&quot;rr-subtitle&quot;&gt;Where LinkedIn shows “Robo Reliance commented” on a robotics company’s own post, how many companies are reached, how many are not, and how often direct engagement appears.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;rr-date&quot;&gt;Last refreshed&lt;br&gt;&lt;time datetime=&quot;2026-08-27T17:41:00-06:00&quot;&gt;August 27, 2026 &#183; 5:41 PM MDT&lt;/time&gt;&lt;/div&gt;
  &lt;/header&gt;

  &lt;main class=&quot;rr-main&quot;&gt;
    &lt;details class=&quot;rr-criteria&quot;&gt;
      &lt;summary&gt;
        &lt;span&gt;&lt;span class=&quot;rr-criteria-summary-title&quot;&gt;Criteria, targeting policy, and metric definitions&lt;/span&gt;&lt;span class=&quot;rr-criteria-summary-copy&quot;&gt;What is verified, what stays pending, how companies are prioritized, and how totals are calculated.&lt;/span&gt;&lt;/span&gt;
        &lt;span class=&quot;rr-criteria-toggle&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;
      &lt;/summary&gt;
      &lt;div class=&quot;rr-criteria-content&quot;&gt;
        &lt;div class=&quot;rr-criteria-grid&quot;&gt;
          &lt;div&gt;
            &lt;h2 class=&quot;rr-section-title&quot;&gt;Evidence criteria&lt;/h2&gt;
            &lt;dl class=&quot;rr-criteria-list&quot;&gt;
              &lt;div&gt;&lt;dt&gt;Actual company post&lt;/dt&gt;&lt;dd&gt;The robotics company published the post, LinkedIn shows “Robo Reliance commented,” and the Robo Reliance comment is visible inside that post’s thread.&lt;/dd&gt;&lt;/div&gt;
              &lt;div&gt;&lt;dt&gt;Third-party post only&lt;/dt&gt;&lt;dd&gt;Robo Reliance commented on another person’s or organization’s post discussing the robotics company, but a comment on the company’s own post is not confirmed.&lt;/dd&gt;&lt;/div&gt;
              &lt;div&gt;&lt;dt&gt;No direct company-post comment confirmed&lt;/dt&gt;&lt;dd&gt;No qualifying comment was found in the posts and threads reviewed. This is an open evidence status—not proof that Robo Reliance never commented.&lt;/dd&gt;&lt;/div&gt;
              &lt;div&gt;&lt;dt&gt;Reported LinkedIn engagement awaiting verification&lt;/dt&gt;&lt;dd&gt;An agent or operator reported LinkedIn activity, but the dashboard does not yet have the date and evidence link required to change the verified status. Reported activity appears in freshness notes, not coverage totals.&lt;/dd&gt;&lt;/div&gt;
              &lt;div&gt;&lt;dt&gt;Company inclusion&lt;/dt&gt;&lt;dd&gt;The core watchlist includes companies whose primary business is robotics or robotic systems. Associations and broad technology companies are excluded from the main count.&lt;/dd&gt;&lt;/div&gt;
            &lt;/dl&gt;
          &lt;/div&gt;
          &lt;div&gt;
            &lt;h2 class=&quot;rr-section-title&quot;&gt;Metric calculations&lt;/h2&gt;
            &lt;dl class=&quot;rr-criteria-list&quot;&gt;
              &lt;div&gt;&lt;dt&gt;Confirmed comments &#183; 20&lt;/dt&gt;&lt;dd&gt;Distinct Robo Reliance comments verified on robotics companies’ own LinkedIn posts. Multiple separate company posts count separately.&lt;/dd&gt;&lt;/div&gt;
              &lt;div&gt;&lt;dt&gt;Companies reached &#183; 19 of 71&lt;/dt&gt;&lt;dd&gt;Unique robotics companies with at least one confirmed qualifying comment. A company is counted once regardless of comment frequency.&lt;/dd&gt;&lt;/div&gt;
              &lt;div&gt;&lt;dt&gt;Direct coverage &#183; 26.8%&lt;/dt&gt;&lt;dd&gt;Companies reached divided by all tracked robotics companies: 19 &#247; 71.&lt;/dd&gt;&lt;/div&gt;
              &lt;div&gt;&lt;dt&gt;Without confirmed direct engagement &#183; 52&lt;/dt&gt;&lt;dd&gt;The 12 third-party-only companies plus 40 companies where no direct company-post comment is confirmed.&lt;/dd&gt;&lt;/div&gt;
              &lt;div&gt;&lt;dt&gt;Observed cadence &#183; 2.15 per week&lt;/dt&gt;&lt;dd&gt;Nineteen dated or observation-dated comments across the 62-day evidence window. The undated FANUC confirmation is excluded.&lt;/dd&gt;&lt;/div&gt;
            &lt;/dl&gt;
          &lt;/div&gt;
          &lt;div class=&quot;rr-criteria-wide&quot;&gt;
            &lt;h2 class=&quot;rr-section-title&quot;&gt;Targeting and safety criteria&lt;/h2&gt;
            &lt;dl class=&quot;rr-criteria-list&quot;&gt;
              &lt;div&gt;&lt;dt&gt;Daily target&lt;/dt&gt;&lt;dd&gt;High-fit agricultural, field, logistics, or serviceable-fleet company. Review only when a relevant, non-sensitive post is recent—preferably under 24 hours old.&lt;/dd&gt;&lt;/div&gt;
              &lt;div&gt;&lt;dt&gt;Weekly target&lt;/dt&gt;&lt;dd&gt;Useful strategic fit or audience reach, but lower urgency, lower buyer likelihood, or a slower posting cadence. Review on a weekly rotation rather than forcing daily activity.&lt;/dd&gt;&lt;/div&gt;
              &lt;div&gt;&lt;dt&gt;Occasional&lt;/dt&gt;&lt;dd&gt;Visibility may be useful, but the serviceable U.S. install base is limited or threads carry elevated political, tariff, import, or brand risk. Engage selectively after a topic-risk check.&lt;/dd&gt;&lt;/div&gt;
              &lt;div&gt;&lt;dt&gt;Like only&lt;/dt&gt;&lt;dd&gt;Used for surgical robotics and similar patient-safety-adjacent content. Avoid comments that could imply clinical expertise, service capability, or safety claims.&lt;/dd&gt;&lt;/div&gt;
              &lt;div&gt;&lt;dt&gt;Never engage&lt;/dt&gt;&lt;dd&gt;A standing hard rule. Chef Robotics is explicitly excluded from comments, likes, and outreach; the dashboard may retain it only for visibility and audit purposes.&lt;/dd&gt;&lt;/div&gt;
              &lt;div&gt;&lt;dt&gt;Policy does not alter evidence&lt;/dt&gt;&lt;dd&gt;Targeting policy controls recommended action, not historical status. A company can remain verified as directly engaged while its future policy is occasional, like-only, or never.&lt;/dd&gt;&lt;/div&gt;
            &lt;/dl&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/details&gt;

    &lt;section class=&quot;rr-scope&quot; aria-labelledby=&quot;rr-scope-heading&quot;&gt;
      &lt;div&gt;
        &lt;h2 id=&quot;rr-scope-heading&quot;&gt;Why these 71 companies?&lt;/h2&gt;
        &lt;p&gt;This is a curated global robotics watchlist built from companies encountered and reviewed during the Robo Reliance analysis. Inclusion means “tracked,” not “recommended”: low-fit, like-only, occasional, and never-engage companies remain visible for auditability and to prevent accidental outreach. It is not limited to U.S.-based companies and is not a complete list of every robotics company.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;rr-scope-summary&quot;&gt;Global watchlist &#183; 9 segments&lt;br&gt;North America, Europe and Asia&lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;rr-activity-grid&quot; aria-label=&quot;Company-page comment activity summary&quot;&gt;
      &lt;article class=&quot;rr-activity-stat&quot;&gt;&lt;strong&gt;20&lt;/strong&gt;&lt;span&gt;confirmed comments on robotics-company posts&lt;/span&gt;&lt;/article&gt;
      &lt;button class=&quot;rr-activity-stat&quot; type=&quot;button&quot; data-metric-filter=&quot;direct&quot; aria-label=&quot;Show the 19 of 71 watchlist companies reached&quot;&gt;&lt;strong&gt;19 of 71&lt;/strong&gt;&lt;span&gt;watchlist companies reached &#183; 26.8%&lt;/span&gt;&lt;/button&gt;
      &lt;button class=&quot;rr-activity-stat&quot; type=&quot;button&quot; data-metric-filter=&quot;not-direct&quot; aria-label=&quot;Show the 52 of 71 watchlist companies without a confirmed direct comment&quot;&gt;&lt;strong&gt;52 of 71&lt;/strong&gt;&lt;span&gt;watchlist companies without a confirmed direct comment &#183; 73.2%&lt;/span&gt;&lt;/button&gt;
      &lt;article class=&quot;rr-activity-stat&quot;&gt;&lt;strong&gt;2.15 / week&lt;/strong&gt;&lt;span&gt;observed rate across 19 dated comments&lt;/span&gt;&lt;/article&gt;
    &lt;/section&gt;

    &lt;section class=&quot;rr-review&quot; aria-labelledby=&quot;rr-review-heading&quot;&gt;
      &lt;h2 class=&quot;rr-section-title&quot; id=&quot;rr-review-heading&quot;&gt;How direct comments are verified&lt;/h2&gt;
      &lt;p class=&quot;rr-section-copy&quot;&gt;The Diligent Robotics case shows why company-level search is not enough.&lt;/p&gt;
      &lt;ol class=&quot;rr-review-steps&quot;&gt;
        &lt;li&gt;&lt;strong&gt;1 &#183; Open company posts&lt;/strong&gt;&lt;span&gt;Review the robotics company’s own LinkedIn feed, not only search results.&lt;/span&gt;&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;2 &#183; Open comment threads&lt;/strong&gt;&lt;span&gt;Inspect posts with comments and open the complete discussion.&lt;/span&gt;&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;3 &#183; Expand and scan&lt;/strong&gt;&lt;span&gt;Load visible comments and replies until “Robo Reliance commented” is found or the review is exhausted.&lt;/span&gt;&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;4 &#183; Capture evidence&lt;/strong&gt;&lt;span&gt;Save the exact post or comment URL and comment date before marking the company confirmed.&lt;/span&gt;&lt;/li&gt;
      &lt;/ol&gt;
      &lt;p class=&quot;rr-review-note&quot;&gt;A company without confirmed evidence is an open review item—not proof that Robo Reliance has never commented there.&lt;/p&gt;

      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
